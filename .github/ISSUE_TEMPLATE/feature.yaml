name: Feature request or new functionality
description: Suggest a capability for the Rust enforcement core or the agent skill
labels: ["platform"]
body:
  - type: markdown
    attributes:
      value: |
        ## Feature request

        `writ` is the enforcement and admission-control layer for coding-agent
        fleets. It blocks unsafe git mutations at the boundary, leases worktrees it
        did not create, and never merges. Keep descriptions concise so a subagent
        can act on them without a second round trip.

  - type: input
    id: feature-title
    attributes:
      label: Feature name or short title
      description: One-line summary of the new capability.
      placeholder: 'e.g. "Reject ambiguous unqualified start-point refs"'
    validations:
      required: true

  - type: textarea
    id: why-needed
    attributes:
      label: Why is this necessary? What does it solve?
      description: Use cases, what is blocked without it, and how it improves reliability or safety.
      placeholder: "Exact-base resolution accepts an ambiguous refname, so a worker can be created from a same-named tag when the caller meant the branch..."
    validations:
      required: true

  - type: textarea
    id: specs-or-refs
    attributes:
      label: Design notes or linked issue (optional)
      description: |
        Constraints and expected behaviour. Link the GitHub issue, or the Linear
        twin under project `worktrees-hives` — the Linear project keeps its
        original name; only the GitHub repository was renamed to `writ`.

  - type: textarea
    id: test-plan
    attributes:
      label: How would this be verified? (optional for docs-only changes)
      description: |
        Name the check that would fail before and pass after. Native gates are
        canonical: `cargo fmt`, `cargo clippy -D warnings`, `cargo test`.
        External analyzers are advisory until a finding is reproduced.

  - type: checkboxes
    id: safety
    attributes:
      label: Non-negotiable safety rules
      description: See AGENTS.md for the authoritative contract.
      options:
        - label: This does not introduce a merge path, auto-merge, or merge queue, and does not require a bare `--force` push
          required: true
