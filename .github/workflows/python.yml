name: Python

on:
  push:
    branches: [main]
    paths:
      - "python/**"
      - "pyproject.toml"
      - ".github/workflows/python.yml"
  pull_request:
    paths:
      - "python/**"
      - "pyproject.toml"
      - ".github/workflows/python.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-python-pkg:
    name: check Python package exists
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
      has-cargo: ${{ steps.check.outputs.has-cargo }}
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Check for python/ directory
        id: check
        run: |
          if [ -d "python" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::python/ directory not found; skipping Python CI."
          fi
          if [ -f "python/Cargo.toml" ]; then
            echo "has-cargo=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-cargo=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: ruff + mypy
    needs: [check-python-pkg]
    if: needs.check-python-pkg.outputs.exists == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14.7"

      - name: Install package (dev extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./python[dev]"

      - name: Run Ruff linter
        run: ruff check python/

      - name: Run Ruff formatter check
        run: ruff format --check python/

      - name: Run mypy type checking
        working-directory: python
        run: mypy --config-file pyproject.toml src

  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: [check-python-pkg, lint]
    if: needs.check-python-pkg.outputs.exists == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.14.7"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install stable Rust
        if: needs.check-python-pkg.outputs.has-cargo == 'true'
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Cache Cargo artifacts
        if: needs.check-python-pkg.outputs.has-cargo == 'true'
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wh CLI
        if: needs.check-python-pkg.outputs.has-cargo == 'true'
        run: cargo build --release --package wh

      - name: Install Python package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./python[dev]"

      - name: Run tests
        env:
          # Only point WH_BIN at a built artifact when the Rust CLI is built above.
          WH_BIN: ${{ needs.check-python-pkg.outputs.has-cargo == 'true' && format('{0}/target/release/wh', github.workspace) || '' }}
        run: python -m pytest python/tests/ -v --tb=short
