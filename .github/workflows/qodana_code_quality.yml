# Qodana static analysis for the Rust workspace.
#
# Restored after #144 removed the Python-only configuration. The linter changed
# from `qodana-python-community` to `qodana-rust`, and that change carries a
# licensing consequence that dictates this workflow's triggers:
#
#   `qodana-rust` is EAP and is available only under Ultimate / Ultimate Plus.
#   There is no community Rust linter. The old workflow could run token-free
#   because a *community* linter needs no license; this one cannot.
#
# Therefore this workflow deliberately does NOT run on pull_request:
#   - Fork PRs never receive repository secrets, so a PR run would have no
#     token and would fail on licensing rather than report findings.
#   - A permanently red, non-actionable PR check trains reviewers to ignore
#     checks, which is worse than having no check.
#
# Enable the PR path only after confirming the Qodana Cloud project is licensed
# for Ultimate; then add `pull_request` back and set `pr-mode: true`.
#
# Hardening retained from the previous configuration:
# - SHA-pinned actions with version comments
# - default contents: read; write granted only for Qodana check reporting
# - concurrency cancel-in-progress
# - persist-credentials: false on checkout
name: Qodana

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "releases/*"
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "qodana.yaml"
      - ".github/workflows/qodana_code_quality.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qodana:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Qodana scan
        uses: JetBrains/qodana-action@4861e015da555e86a72b862892aba6c2b93e6891 # v2026.1.3
        with:
          # pr-mode is meaningless outside a pull_request event; see header.
          pr-mode: false
          # Space-separated args (the comma-separated form is deprecated).
          # The linter is named here so the workflow, not a file a contributor
          # could edit, controls what runs -- but it must be the SAME pinned
          # image as `qodana.yaml`. `--linter` overrides the file, so passing a
          # bare `qodana-rust` here would silently defeat the pin and resolve an
          # untagged EAP linter.
          args: --linter jetbrains/qodana-rust:2026.1-eap --within-docker=false
          upload-result: true
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
