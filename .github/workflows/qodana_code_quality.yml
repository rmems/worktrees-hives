# Qodana static analysis for the Python package under python/.
#
# Hardening (aligned with python.yml / security.yml):
# - SHA-pinned actions with version comments (same SHAs as python.yml/security.yml)
# - Default contents: read; job grants write only for Qodana check/PR reporting
# - concurrency cancel-in-progress
# - persist-credentials: false before pip install -e (untrusted packaging)
# - QODANA_TOKEN only on push to main / releases/* (not PR, not workflow_dispatch)
# - paths filter: only when Python or this workflow changes (docs-only PRs skip)
# - Fork PRs do not receive repository secrets; PR path has empty QODANA_TOKEN
#   (jobs still get the restricted automatic GITHUB_TOKEN for GitHub API reporting)
# - Python 3.14.7 matches python.yml / release.yml matrix (not 3.13)
name: Qodana

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "python/**"
      - ".github/workflows/qodana_code_quality.yml"
  push:
    branches:
      - main
      - "releases/*"
    paths:
      - "python/**"
      - ".github/workflows/qodana_code_quality.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qodana:
    runs-on: ubuntu-latest
    # Least-privilege for this job: contents read only for install/scan steps.
    # pull-requests/checks write is required by JetBrains/qodana-action to post
    # GitHub check runs and PR quality comments (not contents write).
    # Full scan/report job isolation (trusted publish separate from PR-head
    # pip install) is a larger follow-up; persist-credentials: false mitigates
    # git credential reuse but not default GITHUB_TOKEN availability to actions.
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # PR head when present; otherwise the event SHA (push / workflow_dispatch).
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0  # full history for PR analysis
          # Do not leave the job token in .git: pip install -e runs PR packaging code.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        id: setup-python
        with:
          # Keep in lockstep with .github/workflows/python.yml (matrix 3.14.7 only).
          python-version: "3.14.7"

      - name: Install Python dependencies
        working-directory: python
        run: pip install -e ".[test]"

      - name: Qodana Scan
        uses: JetBrains/qodana-action@4861e015da555e86a72b862892aba6c2b93e6891 # v2026.1.3
        with:
          # PR-delta analysis only on pull_request; full scan on push/dispatch.
          pr-mode: ${{ github.event_name == 'pull_request' }}
          # Space-separated args (comma-separated form is deprecated by qodana-action).
          # Force community linter + project-dir so scan args are workflow-controlled.
          args: --linter qodana-python-community --project-dir=python --within-docker=false
        env:
          # Cloud token only on push to protected refs. workflow_dispatch can target
          # any branch, so it never receives QODANA_TOKEN. PR path is always empty
          # (fork PRs also never receive repository secrets).
          QODANA_TOKEN: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/releases/')) && secrets.QODANA_TOKEN_1561455798 || '' }}
          QODANA_ENDPOINT: "https://qodana.cloud"
          QODANA_PYTHON_PATH: ${{ steps.setup-python.outputs.python-path }}
          JAVA_TOOL_OPTIONS: --enable-native-access=ALL-UNNAMED --sun-misc-unsafe-memory-access=allow
