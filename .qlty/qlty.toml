# Minimum reproducible Qlty baseline (GitHub #133).
#
# Local command that reproduces the Qlty Cloud PR check:
#   qlty check
#
# This file is used by both Qlty CLI and Qlty Cloud
# (https://docs.qlty.sh/cli/qlty-toml). Without it, Cloud runs a temporary
# `qlty init` and applies production Bandit policy to pytest code.
#
# Plugins: Bandit remains the production security plugin. Native CI remains
# the owner of ruff / mypy / clippy / rustfmt / cargo test. Do not add
# analyzer families here without a dedicated issue.
#
# Production Python analysis stays enabled. B101 / B108 are ignored only under
# test paths so a deliberate production assert or insecure temp path still
# blocks.
#
# Qlty Cloud also emits built-in structure smells (`qlty:function-parameters`,
# `qlty:file-complexity`, `qlty:return-statements`). Those are not security
# findings. Coordination APIs (Rust `WorktreeManager::create`, Python
# `claim_pr` / `_fail`, and `bridge.py` schema negotiation) need explicit
# parameters and branched version/error handling so the worktree boundary
# stays inspectable. Do not extract methods just to satisfy these counts.
config_version = "0"

exclude_patterns = [
  "*_min.*",
  "*-min.*",
  "*.min.*",
  "**/.yarn/**",
  "**/*.d.ts",
  "**/assets/**",
  "**/bower_components/**",
  "**/build/**",
  "**/cache/**",
  "**/db/**",
  "**/deps/**",
  "**/dist/**",
  "**/extern/**",
  "**/external/**",
  "**/generated/**",
  "**/Godeps/**",
  "**/gradlew/**",
  "**/mvnw/**",
  "**/node_modules/**",
  "**/protos/**",
  "**/seed/**",
  "**/target/**",
  "**/templates/**",
  "**/testdata/**",
  "**/vendor/**",
]

test_patterns = [
  "**/test/**",
  "**/tests/**",
  "python/tests/**",
  "**/spec/**",
  "**/*.test.*",
  "**/*.spec.*",
  "**/*_test.*",
  "**/*_spec.*",
  "**/test_*.*",
  "**/spec_*.*",
]

[[source]]
name = "default"
default = true

[[plugin]]
name = "bandit"

# pytest uses `assert` as its assertion API. Bandit B101 is a production
# concern (asserts are stripped under -O). Keep production B101 enabled.
[[triage]]
match.plugins = ["bandit"]
match.rules = ["bandit:B101"]
match.file_patterns = ["python/tests/**", "**/tests/**", "**/test_*.py"]
set.ignored = true

# Synthetic tempfile / `/tmp/...` fixtures in tests. Production B108 remains
# enabled so insecure temporary-file use in runtime Python still blocks.
[[triage]]
match.plugins = ["bandit"]
match.rules = ["bandit:B108"]
match.file_patterns = ["python/tests/**", "**/tests/**", "**/test_*.py"]
set.ignored = true

# Structure-only Qlty smells. The `qlty` plugin/smell family here emits
# maintainability counts, not Bandit findings. Ignore the three rules that
# are blocking PR #131 globally: every current hit is on a coordination
# surface that must keep its explicit request/error shape.
[smells.function_parameters]
enabled = false

[smells.file_complexity]
enabled = false

[smells.return_statements]
enabled = false

[[triage]]
match.rules = [
  "qlty:function-parameters",
  "qlty:file-complexity",
  "qlty:return-statements",
]
set.ignored = true
set.mode = "comment"
