[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "worktrees-hives"
version = "0.2.0"
description = "Python orchestrator for worktrees-hives: issue-to-PR and PR-babysit with isolated subagents"
readme = "../README.md"
license = "Apache-2.0"
requires-python = ">=3.14.7"
authors = [
    { name = "rmems", email = "noreply@example.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]
test = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.urls]
Homepage = "https://github.com/rmems/worktrees-hives"
Repository = "https://github.com/rmems/worktrees-hives"
Issues = "https://github.com/rmems/worktrees-hives/issues"

[project.scripts]
worktrees-hives = "worktrees_hives.cli:main"
wh-orch = "worktrees_hives.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/worktrees_hives"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "TCH",
    "RUF",
]
ignore = [
    "E501",
]

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
packages = ["worktrees_hives"]
mypy_path = "src"
