# Codacy configuration for the Rust-only workspace, restored after #144.
#
# The org quality gate uses issueThreshold=0, so a single unsuppressed
# false-positive class blocks every PR. Two such classes exist here:
#
# 1. Agentlinter flags "absolute rule without escape hatch" on AGENTS.md and
#    CLAUDE.md. That is precisely what those files are for: `never merge
#    autonomously` and `bare --force is forbidden` are deny-by-default safety
#    rules, and adding an escape hatch to satisfy a linter would weaken the
#    security contract. Excluded here rather than softening the text.
#    (PR #144 reproduced exactly this: 2 medium BestPractice findings on
#    AGENTS.md L106 and L165.)
#
# 2. Cyclomatic-complexity engines flag the coordination surfaces, which keep
#    explicit parameters and branched schema negotiation on purpose. Do not
#    rewrite them for complexity theater. Security engines stay enabled.
#
# `metric` is Codacy's official cyclomatic-complexity engine name; `complexity`
# and `lizard` are included so either Cloud spelling still applies.
#
# Paths use globs so the pending `wh` -> `writ` crate rename (#145) does not
# invalidate this file.
---
exclude_paths:
  - "AGENTS.md"
  - "CLAUDE.md"
  - "**/target/**"

engines:
  duplication:
    exclude_paths:
      - "crates/*/tests/**"
      - "**/target/**"
  complexity:
    exclude_paths:
      - "crates/*/tests/**"
      - "crates/*/src/worktree.rs"
      - "crates/*/src/error.rs"
      - "crates/*/src/git_safe.rs"
      - "crates/*/src/main.rs"
  metric:
    exclude_paths:
      - "crates/*/tests/**"
      - "crates/*/src/worktree.rs"
      - "crates/*/src/error.rs"
      - "crates/*/src/git_safe.rs"
      - "crates/*/src/main.rs"
  lizard:
    exclude_paths:
      - "crates/*/tests/**"
      - "crates/*/src/worktree.rs"
      - "crates/*/src/error.rs"
      - "crates/*/src/git_safe.rs"
      - "crates/*/src/main.rs"
