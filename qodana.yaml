# Qodana for the Rust-only workspace, restored after the Python removal in #144.
#
# LICENSING, READ BEFORE ENABLING ON PULL REQUESTS:
# `qodana-rust` is based on RustRover, ships as `jetbrains/qodana-rust`, is
# currently EAP, and is available only under Ultimate / Ultimate Plus licenses.
# There is no `qodana-rust-community` equivalent. The previous configuration used
# `qodana-python-community`, which is why it ran with no working token.
# See https://www.jetbrains.com/help/qodana/rust.html
version: "1.0"
linter: jetbrains/qodana-rust:2026.1-eap
profile:
  name: qodana.recommended
exclude:
  - name: All
    paths:
      - target
      - .git
